const Num=({v})=>{const m=(typeof v==='string'||typeof v==='number')?String(v).match(/^(\d+)(.*)$/):null;const [n,setN]=useState(m?0:null);

function Auth({signup}){
  const {toast}=useContext(Ctx);
  const [f,setF]=useState({name:'',email:'',password:'',sid:'',dept:DEPTS[0],sem:'1'});
  const [e,setE]=useState({});
  const [loading,setLoading]=useState(false);

  const ch=k=>ev=>setF({...f,[k]:ev.target.value});

  const go=async()=>{
    const x={};
    if(signup&&!f.name.trim())x.name='Name is required';
    if(!/^\S+@\S+\.\S+$/.test(f.email))x.email='Enter a valid email';
    if(f.password.length<6)x.password='Min 6 characters';
    if(signup&&!f.sid.trim())x.sid='Student ID is required';
    setE(x);
    if(Object.keys(x).length)return;

    setLoading(true);

    try{
      if(signup){
        const {data,error}=await supabase.auth.signUp({
          email:f.email,
          password:f.password,
          options:{data:{full_name:f.name}}
        });

        if(error)throw error;
        if(!data.user)throw new Error('Unable to create account.');

        const {error:profileError}=await supabase
          .from('profiles')
          .update({
            full_name:f.name,
            email:f.email,
            student_id:f.sid,
            department:f.dept,
            semester:Number(f.sem),
            role:'student'
          })
          .eq('id',data.user.id);

        if(profileError)throw profileError;

        if(!data.session){
          toast('Account created. Check your email to confirm, then login.');
          nav('/login');
        }else{
          toast('Account created successfully!');
          nav('/student/dashboard');
        }
      }else{
        const {data,error}=await supabase.auth.signInWithPassword({
          email:f.email,
          password:f.password
        });

        if(error)throw error;

        const {data:profile,error:profileError}=await supabase
          .from('profiles')
          .select('*')
          .eq('id',data.user.id)
          .single();

        if(profileError)throw profileError;

        nav(profile.role==='admin'?'/admin/dashboard':'/student/dashboard');
        toast('Welcome back!');
      }
    }catch(err){
      console.error(err);
      toast(err.message||'Authentication failed','err');
    }finally{
      setLoading(false);
    }
  };

  return <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-violet-50">
    <Card c="w-full max-w-md p-7">
      <Logo/>
      <h1 className="text-2xl font-bold mt-4">{signup?'Create your account':'Welcome back'}</h1>
      <p className="text-sm text-slate-500 mb-5">Your Campus. One Intelligent Assistant.</p>

      {signup&&<Field l="Full Name" value={f.name} onChange={ch('name')} err={e.name}/>}
      <Field l="Email" t="email" value={f.email} onChange={ch('email')} err={e.email}/>
      <Field l="Password" t="password" value={f.password} onChange={ch('password')} err={e.password}/>

      {signup&&<>
        <Field l="Student ID" value={f.sid} onChange={ch('sid')} err={e.sid}/>
        <Field l="Department" t="select" opts={DEPTS} value={f.dept} onChange={ch('dept')}/>
        <Field l="Semester" t="select" opts={['1','2','3','4','5','6','7','8']} value={f.sem} onChange={ch('sem')}/>
      </>}

      {!signup&&<div className="flex justify-between text-sm mb-4">
        <label><input type="checkbox" defaultChecked/> Remember me</label>
        <button className="text-indigo-600" onClick={()=>toast('Password reset can be added next.')}>Forgot password?</button>
      </div>}

      <Btn c="w-full" disabled={loading} onClick={go}>
        {loading?'Please wait...':(signup?'Create Account':'Login')}
      </Btn>

      {!signup&&<p className="text-xs text-slate-500 text-center mt-3">
        Admin users are automatically routed to the Admin Dashboard based on their Supabase role.
      </p>}

      <p className="text-sm text-center mt-4 text-slate-500">
        {signup?'Have an account? ':'New here? '}
        <a className="text-indigo-600 font-medium" href={signup?'#/login':'#/signup'}>
          {signup?'Login':'Sign up'}
        </a>
      </p>
    </Card>
  </div>
}

const dayName=()=>{const d=new Date().getDay();return ['Monday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]};
const parse=s=>{const [a,b,c,d,e]=s.split('|');return {sub:a,fac:b,room:c,st:d,en:e}};
const ClassRow=({c})=><div className="flex items-center gap-3 p-3 rounded-xl bg-slate-50"><div className="text-xs text-indigo-700 font-semibold w-24">{c.st} – {c.en}</div><div className="flex-1"><div className="font-medium text-sm">{c.sub}</div><div className="text-xs text-slate-500">{c.fac} · {c.room}</div></div></div>;

function Assistant({compact}){
 const {S}=useContext(Ctx);
 const [msgs,setM]=useState([{r:'a',t:'Hi! I’m CampusAI 👋 Ask me about your timetable, notices, events, complaints, or campus FAQs.'}]);
 const [q,setQ]=useState(''),[ty,setTy]=useState(false);
 const P=['What classes do I have today?','Show me the latest examination notice','What is the status of my complaint?','What events are happening this week?'];
 const answer=async(t)=>{
   const l=t.toLowerCase();
   if(l.includes('class')||l.includes('timetable')||l.includes('schedule')){
     const d=new Date().getDay();
     const day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d];
     const rows=S.tt[day]||[];
     if(!rows.length)return ['There are no timetable entries available for '+day+'.','Based on your timetable'];
     const parsed=rows.map(x=>parse(x));
     return [day+"'s schedule:\n\n"+parsed.map(x=>`${x.st} – ${x.en}  ${x.sub}\n${x.fac} · ${x.room}`).join('\n\n'),'Based on your timetable'];
   }
   if(l.includes('notice')||l.includes('exam')||l.includes('announcement')){
     const {data,error}=await supabase.from('notices').select('*').eq('published',true).order('created_at',{ascending:false}).limit(1).maybeSingle();
     if(error)return ['I could not load the latest notice right now. Please try again.','Campus Notices'];
     if(!data)return ['There are no published notices available right now.','Campus Notices'];
     return [`Latest notice: ${data.title}\n\n${data.content||'No additional details.'}\n\nPriority: ${data.priority||'Normal'}`,'Based on College Notices'];
   }
   if(l.includes('complaint')||l.includes('grievance')){
     const {data:{user}}=await supabase.auth.getUser();
     if(!user)return ['Please log in to view your complaint status.','Authentication'];
     const {data,error}=await supabase.from('complaints').select('id,title,status,admin_response,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
     if(error)return ['I could not load your complaint status right now. Please try again.','Your Complaints'];
     if(!data)return ['You have not submitted any complaints yet.','Your Complaints'];
     return [`Your latest complaint (#${data.id}) is currently ${data.status}.\n\n${data.title}${data.admin_response?'\n\nAdmin response: '+data.admin_response:''}`,'Based on your complaints'];
   }
   if(l.includes('event')||l.includes('workshop')||l.includes('happening')){
     const today=new Date().toISOString().slice(0,10); const end=new Date(); end.setDate(end.getDate()+7); const endDate=end.toISOString().slice(0,10);
     const {data,error}=await supabase.from('events').select('*').eq('published',true).gte('event_date',today).lte('event_date',endDate).order('event_date',{ascending:true}).order('start_time',{ascending:true}).limit(5);
     if(error)return ['I could not load upcoming events right now. Please try again.','Campus Events'];
     if(!data?.length)return ['There are no published events scheduled in the next 7 days.','Campus Events'];
     return ['Upcoming events:\n\n'+data.map(e=>`${e.title}\n${e.event_date}${e.start_time?' · '+String(e.start_time).slice(0,5):''}${e.venue?' · '+e.venue:''}`).join('\n\n'),'Based on Campus Events'];
   }
   const f=S.faqs.find(x=>l.split(/\s+/).some(w=>w.length>4&&x.q.toLowerCase().includes(w)));
   if(f)return [f.a,'Based on Campus FAQs'];
   return ["I couldn't find a reliable answer yet. Try asking about your timetable, notices, events, complaints, or campus FAQs.",'No source found'];
 };
 const send=async t=>{
   t=t||q;if(!t.trim()||ty)return; setQ('');setM(m=>[...m,{r:'u',t}]);setTy(true);
   try{const [a,src]=await answer(t);setM(m=>[...m,{r:'a',t:a,src}]);}
   catch(e){console.error('ASSISTANT ERROR:',e);setM(m=>[...m,{r:'a',t:'Something went wrong while checking campus data. Please try again.',src:'CampusAI'}]);}
   finally{setTy(false);}
 };
 return <div className={compact?'':'flex flex-col h-[calc(100vh-9rem)]'}>{!compact&&<Head t="CampusAI Assistant" s="Ask questions about your campus."><Orb size={84} busy={ty}/></Head>}
 <Card c={'flex flex-col '+(compact?'':'flex-1 min-h-0')}>{compact&&<div className="absolute top-2 right-3 z-10"><Orb size={44} busy={ty}/></div>}<div className={'overflow-auto p-4 space-y-3 '+(compact?'max-h-64':'flex-1')}>{msgs.map((m,i)=><div key={i} className={'flex '+(m.r==='u'?'justify-end':'')}><div className={'max-w-[85%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-line '+(m.r==='u'?'bg-indigo-600 text-white':'bg-slate-100')}>{m.t}{m.src&&<div className="text-xs text-slate-500 mt-2">📎 {m.src}</div>}</div></div>)}{ty&&<div className="bg-slate-100 rounded-2xl px-4 py-2.5 w-fit text-sm animate-pulse">CampusAI is checking campus data...</div>}</div>
 <div className="p-3 border-t border-slate-100"><div className="flex gap-2 overflow-x-auto mb-2">{P.map(p=><button key={p} onClick={()=>send(p)} className="text-xs whitespace-nowrap border border-indigo-200 text-indigo-700 rounded-full px-3 py-1 hover:bg-indigo-50">{p}</button>)}</div><div className="flex gap-2"><input className={inp} placeholder="Ask anything about your campus..." value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><Btn onClick={()=>send()}>Send</Btn></div></div></Card></div>}

const NoticeCard=({n})=><Card c="p-4 cursor-pointer hover:shadow-md" onClick={()=>nav('/student/notices/'+n.id)}><div className="flex justify-between gap-2"><Badge s={n.cat}/><span className="text-xs text-slate-400">{fmt(n.date)}</span></div><h3 className="font-semibold mt-2">{n.title}</h3><p className="text-sm text-slate-500">{n.desc}</p></Card>;
const ComplaintRow=({c,onClick})=><tr className="border-t border-slate-100 cursor-pointer hover:bg-slate-50" onClick={onClick}><td className="p-3">#{c.id}</td><td className="p-3">{c.title}</td><td className="p-3">{c.cat}</td><td className="p-3">{fmt(c.date)}</td><td className="p-3"><Badge s={c.status}/></td></tr>;

function StudentPage({seg}){
  const {S,me,setMe,toast,profile}=useContext(Ctx);
  const [detailComplaint,setDetailComplaint]=useState(null);
  const [tab,setTab]=useState('Upcoming');
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('');
  const [dt,setDt]=useState('');
  const [day,setDay]=useState(dayName());
  const [cf,setCf]=useState({cat:'Academic',title:'',desc:''});
  const [done,setDone]=useState(null);
  const [ed,setEd]=useState(false);
  const [pf,setPf]=useState(me);

  const [a,b]=[seg[1],seg[2]];

  useEffect(()=>{
    setPf(me);
  },[me.name,me.id,me.email,me.dept,me.sem]);

  useEffect(()=>{
    const loadMyComplaints=async()=>{
      const {data:{user},error:authError}=await supabase.auth.getUser();
      if(authError || !user){
        console.error('COMPLAINT AUTH ERROR:',authError);
        return;
      }

      const {data,error}=await supabase
        .from('complaints')
        .select('*')
        .eq('user_id',user.id)
        .order('created_at',{ascending:false});

      if(error){
        console.error('MY COMPLAINT LOAD ERROR:',error);
        toast(error.message,'err');
        return;
      }

      const mapped=(data||[]).map(c=>({
        id:c.id,
        title:c.title,
        desc:c.description||'',
        cat:c.category||'Other',
        location:c.location||'',
        status:c.status,
        priority:c.priority,
        date:c.created_at,
        student:me.name,
        resp:c.admin_response||''
      }));

      S.setC(mapped);
    };

    if(a==='complaints' && !b){
      loadMyComplaints();
    }
  },[a,b]);

  useEffect(()=>{
    const loadComplaintDetail=async()=>{
      if(a!=='complaints' || !b || b==='new') return;

      setDetailComplaint(null);

      const {data:{user},error:authError}=await supabase.auth.getUser();
      if(authError || !user){
        console.error('DETAIL AUTH ERROR:',authError);
        return;
      }

      const {data,error}=await supabase
        .from('complaints')
        .select('*')
        .eq('id',b)
        .eq('user_id',user.id)
        .single();

      if(error){
        console.error('COMPLAINT DETAIL LOAD ERROR:',error);
        setDetailComplaint(null);
        return;
      }

      setDetailComplaint({
        id:data.id,
        title:data.title,
        desc:data.description||'',
        cat:data.category||'Other',
        location:data.location||'',
        status:data.status,
        priority:data.priority,
        date:data.created_at,
        student:me.name,
        resp:data.admin_response||''
      });
    };

    loadComplaintDetail();
  },[a,b]);

  const mine=S.complaints||[];
  const act=S.notices.filter(n=>n.status==='Active');

  if(a==='dashboard'){
    const cls=S.tt[dayName()]||[];
    return <div>
      <Head t={`Good Morning, ${me.name} 👋`} s="Here's what's happening on your campus today."/>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <Stat i="📚" l="Today's Classes" v={cls.length}/>
        <Stat i="🎉" l="Upcoming Events" v={S.events.filter(e=>e.date>=TODAY).length} c="bg-violet-50"/>
        <Stat i="📝" l="Active Complaints" v={mine.filter(c=>c.status==='In Progress'||c.status==='Under Review'||c.status==='Submitted').length} c="bg-amber-50"/>
        <Stat i="📢" l="New Notices" v={act.length} c="bg-green-50"/>
      </div>
      <Card c="p-5 mb-5 bg-gradient-to-br from-indigo-600 to-violet-600 !border-0">
        <h2 className="text-white text-xl font-bold mb-3">How can I help you today?</h2>
        <input className={inp} placeholder="Ask anything about your campus..." onKeyDown={e=>e.key==='Enter'&&nav('/student/assistant')}/>
        <div className="flex flex-wrap gap-2 mt-3">
          {['What classes do I have tomorrow?','Show me the latest examination notice','What is the status of my complaint?','What events are happening this week?'].map(p=><button key={p} onClick={()=>nav('/student/assistant')} className="text-xs bg-white/20 text-white rounded-full px-3 py-1">{p}</button>)}
        </div>
      </Card>
      <div className="flex flex-wrap gap-2 mb-5">
        {[['Ask CampusAI','/student/assistant'],['View Timetable','/student/timetable'],['Submit Complaint','/student/complaints/new'],['View Notices','/student/notices']].map(([l,p])=><Btn key={l} v="s" onClick={()=>nav(p)}>{l}</Btn>)}
      </div>
      <div className="grid lg:grid-cols-2 gap-4">
        <Card c="p-5"><h3 className="font-semibold mb-3">Latest Notices</h3><div className="space-y-2">{act.slice(0,3).map(n=><a key={n.id} href={'#/student/notices/'+n.id} className="block text-sm p-2 rounded-lg hover:bg-slate-50"><b>{n.title}</b><div className="text-xs text-slate-400">{fmt(n.date)}</div></a>)}</div></Card>
        <Card c="p-5"><h3 className="font-semibold mb-3">Upcoming Events</h3><div className="space-y-2">{S.events.filter(e=>e.date>=TODAY).slice(0,3).map(e=><a key={e.id} href={'#/student/events/'+e.id} className="block text-sm p-2 rounded-lg hover:bg-slate-50"><b>{e.title}</b><div className="text-xs text-slate-400">{fmt(e.date)} · {e.loc}</div></a>)}</div></Card>
        <Card c="p-5"><h3 className="font-semibold mb-3">Today's Timetable</h3><div className="space-y-2">{cls.map(x=><ClassRow key={x} c={parse(x)}/>)}</div></Card>
        <Card c="p-5"><h3 className="font-semibold mb-3">Complaint Status</h3>{mine.length?mine.slice(0,3).map(c=><div key={c.id} className="flex justify-between text-sm py-2 border-b border-slate-100"><span>#{c.id} {c.title}</span><Badge s={c.status}/></div>):<Empty/>}</Card>
      </div>
    </div>;
  }

  if(a==='assistant')return <Assistant/>;

  if(a==='notices'&&b){
    const n=S.notices.find(x=>x.id==b);
    if(!n)return <Empty t="Notice not found"/>;
    return <div className="max-w-3xl"><Btn v="s" onClick={()=>nav('/student/notices')}>← Back to Notices</Btn><Card c="p-6 mt-4"><Badge s={n.cat}/><h1 className="text-2xl font-bold mt-2">{n.title}</h1><p className="text-sm text-slate-500 mb-4">{fmt(n.date)} · By {n.author}</p><p className="leading-relaxed">{n.body||n.desc}</p><Btn v="s" c="mt-5" onClick={()=>{navigator.clipboard?.writeText(location.href).catch(()=>{});toast('Link copied')}}>Share</Btn></Card></div>;
  }

  if(a==='notices'){
    const days={'':1e5,'Last 7 days':7,'Last 30 days':30};
    const L=act.filter(n=>(n.title+n.desc).toLowerCase().includes(q.toLowerCase())&&(!cat||n.cat===cat)&&(new Date(TODAY)-new Date(n.date))/864e5<=(days[dt]||1e5));
    return <div><Head t="College Notices"/><div className="flex flex-wrap gap-2 mb-4"><input className={inp+' max-w-xs'} placeholder="Search notices..." value={q} onChange={e=>setQ(e.target.value)}/><select className={inp+' max-w-[160px]'} value={cat} onChange={e=>setCat(e.target.value)}><option value="">All categories</option>{CATS.map(c=><option key={c}>{c}</option>)}</select><select className={inp+' max-w-[160px]'} value={dt} onChange={e=>setDt(e.target.value)}><option value="">Any date</option><option>Last 7 days</option><option>Last 30 days</option></select></div>{L.length?<div className="grid md:grid-cols-2 gap-3">{L.map(n=><NoticeCard key={n.id} n={n}/>)}</div>:<Empty/>}</div>;
  }

  if(a==='events'&&b){
    const e=S.events.find(x=>x.id==b);
    if(!e)return <Empty t="Event not found"/>;
    return <div className="max-w-3xl"><Card c="p-6"><h1 className="text-2xl font-bold">{e.title}</h1><div className="text-sm text-slate-600 my-3 space-y-1"><div>📅 {fmt(e.date)}</div><div>⏰ {e.time}</div><div>📍 {e.loc}</div><div>🏛️ {e.org}</div></div><p>{e.desc}</p><div className="flex gap-2 mt-5"><Btn onClick={()=>e.registration_url?window.open(e.registration_url,'_blank'):toast('Registration link not available','err')}>Register</Btn><Btn v="s" onClick={()=>nav('/student/events')}>Back to Events</Btn></div></Card></div>;
  }

  if(a==='events'){
    const L=S.events.filter(e=>tab==='Upcoming'?e.date>=TODAY:e.date<TODAY);
    return <div><Head t="Campus Events"/><Tabs tabs={['Upcoming','Past']} v={tab} set={setTab}/>{L.length?<div className="grid md:grid-cols-2 gap-3">{L.map(e=><Card key={e.id} c="p-4"><h3 className="font-semibold">{e.title}</h3><div className="text-xs text-slate-500 my-2">📅 {fmt(e.date)} · ⏰ {e.time} · 📍 {e.loc}</div><p className="text-sm text-slate-600 mb-3">{e.desc}</p><Btn v="s" onClick={()=>nav('/student/events/'+e.id)}>View Details</Btn></Card>)}</div>:<Empty/>}</div>;
  }

  if(a==='timetable')return <div><Head t="Timetable" s={"Today's Schedule: "+dayName()}/><Tabs tabs={Object.keys(S.tt)} v={day} set={setDay}/><div className="space-y-2 max-w-2xl">{(S.tt[day]||[]).map(x=><ClassRow key={x} c={parse(x)}/>)}</div></div>;

  if(a==='complaints'&&b==='new'){
    const sub=async()=>{
      if(!cf.title.trim())return toast('Please enter complaint title','err');
      if(cf.desc.trim().length<10)return toast('Description must be at least 10 characters','err');

      const {data:{user},error:userError}=await supabase.auth.getUser();
      if(userError||!user){console.error('AUTH ERROR:',userError);return toast('Please login again','err');}

      const {data,error}=await supabase.from('complaints').insert({
        user_id:user.id,
        title:cf.title.trim(),
        description:cf.desc.trim(),
        category:cf.cat||'Other',
        location:'',
        status:'Submitted',
        priority:'Normal'
      }).select('*').single();

      if(error){console.error('COMPLAINT CREATE ERROR:',error);toast(error.message,'err');return;}

      const newComplaint={
        id:data.id,title:data.title,desc:data.description,cat:data.category,
        location:data.location||'',status:data.status,priority:data.priority,
        date:data.created_at,student:me.name,resp:data.admin_response||''
      };

      S.setC(prev=>[newComplaint,...prev]);
      setDone(newComplaint);
      toast('Complaint submitted successfully');
    };

    return <div className="max-w-2xl"><Head t="Submit Complaint"/>{done?<Card c="p-6"><div className="text-green-600 font-semibold mb-1">✅ Complaint submitted successfully.</div><p className="text-sm text-slate-500 mb-4">Tracking ID #{done.id}</p><Timeline idx={0}/><Btn c="mt-5" onClick={()=>nav('/student/complaints/'+done.id)}>View Complaint</Btn></Card>:<Card c="p-6"><Field l="Category" t="select" opts={['Academic','Hostel','Infrastructure','Canteen','Other']} value={cf.cat} onChange={e=>setCf({...cf,cat:e.target.value})}/><Field l="Title" value={cf.title} onChange={e=>setCf({...cf,title:e.target.value})}/><Field l="Description" t="textarea" value={cf.desc} onChange={e=>setCf({...cf,desc:e.target.value})}/><div className="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center text-sm text-slate-500 mb-4">📎 Attach a file (optional)</div><Btn onClick={sub}>Submit Complaint</Btn></Card>}</div>;
  }

  if(a==='complaints'&&b){
    const c=detailComplaint;
    if(!c)return <div className="max-w-3xl"><Btn v="s" onClick={()=>nav('/student/complaints')}>← Back</Btn><Card c="p-6 mt-4"><div className="text-center text-slate-500">Loading complaint...</div></Card></div>;
    return <div className="max-w-3xl"><Btn v="s" onClick={()=>nav('/student/complaints')}>← Back</Btn><div className="grid md:grid-cols-5 gap-4 mt-4"><Card c="p-6 md:col-span-3"><div className="flex justify-between"><span className="text-slate-400">#{c.id}</span><Badge s={c.status}/></div><h1 className="text-xl font-bold my-2">{c.title}</h1><div className="text-xs text-slate-500 mb-3">{c.cat} · {fmt(c.date)}</div><p className="text-sm">{c.desc}</p>{c.location&&<div className="text-sm text-slate-500 mt-3">📍 {c.location}</div>}{c.resp&&<div className="mt-4 bg-indigo-50 rounded-xl p-3 text-sm"><b>Admin response:</b> {c.resp}</div>}</Card><Card c="p-6 md:col-span-2"><h3 className="font-semibold mb-3">Progress</h3><Timeline idx={tlIdx(c.status)} rej={c.status==='Rejected'}/></Card></div></div>;
  }

  if(a==='complaints'){
    return <div><Head t="My Complaints"><Btn onClick={()=>nav('/student/complaints/new')}>+ Submit Complaint</Btn></Head><Card c="overflow-x-auto">{mine.length?<table className="w-full text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr>{['ID','Title','Category','Submitted','Status'].map(h=><th key={h} className="p-3">{h}</th>)}</tr></thead><tbody>{mine.map(c=><ComplaintRow key={c.id} c={c} onClick={()=>nav('/student/complaints/'+c.id)}/>)}</tbody></table>:<Empty t="No complaints yet"/>}</Card></div>;
  }

  if(a==='profile'){
    const saveProfile=async()=>{
      if(!pf.name.trim())return toast('Name required','err');

      const {data:{user},error:userError}=await supabase.auth.getUser();
      if(userError||!user)return toast('Please login again','err');

      const {data,error}=await supabase.from('profiles').update({
        full_name:pf.name.trim(),
        email:pf.email.trim(),
        department:pf.dept,
        semester:Number(pf.sem)
      }).eq('id',user.id).select('*').single();

      if(error){console.error('PROFILE UPDATE ERROR:',error);toast(error.message,'err');return;}

      setMe(data);
      setPf({
        name:data.full_name||'',id:data.student_id||'',email:data.email||user.email||'',
        dept:data.department||DEPTS[0],sem:String(data.semester||1)
      });
      setEd(false);
      toast('Profile updated successfully');
    };

    const s=k=>e=>setPf({...pf,[k]:e.target.value});

    return <div className="max-w-2xl"><Head t="Profile"><Btn onClick={()=>ed?saveProfile():setEd(true)}>{ed?'Save Changes':'Edit Profile'}</Btn></Head><Card c="p-6"><div className="flex items-center gap-4 mb-5"><div className="w-16 h-16 rounded-full bg-gradient-to-br from-indigo-600 to-violet-500 text-white text-2xl flex items-center justify-center">{(me.name||'S')[0]}</div><div><b className="text-lg">{me.name}</b><div className="text-sm text-slate-500">{me.id}</div></div></div><h3 className="font-semibold mb-2">Personal Information</h3><div className="grid sm:grid-cols-2 gap-x-3"><Field l="Full Name" disabled={!ed} value={pf.name||''} onChange={s('name')}/><Field l="Email" disabled={!ed} value={pf.email||''} onChange={s('email')}/></div><h3 className="font-semibold mb-2">Academic Information</h3><div className="grid sm:grid-cols-3 gap-x-3"><Field l="Student ID" disabled value={pf.id||''}/><Field l="Department" disabled={!ed} t="select" opts={DEPTS} value={pf.dept||DEPTS[0]} onChange={s('dept')}/><Field l="Semester" disabled={!ed} t="select" opts={['1','2','3','4','5','6','7','8']} value={pf.sem||'1'} onChange={s('sem')}/></div><h3 className="font-semibold mb-2">Account Settings</h3><label className="text-sm block"><input type="checkbox" defaultChecked/> Email notifications</label></Card></div>;
  }

  return <Empty t="Page not found"/>;
}

function AdminFAQs(){
  const {toast,authUser,S}=useContext(Ctx);
  const [items,setItems]=useState([]);
  const [q,setQ]=useState('');
  const [m,setM]=useState(null);
  const [loading,setLoading]=useState(true);

  const load=async()=>{
    setLoading(true);
    const {data,error}=await supabase
      .from('faqs')
      .select('id,question,answer,category,keywords,published,created_by,created_at,updated_at')
      .order('created_at',{ascending:false});

    if(error){
      console.error('ADMIN FAQ LOAD ERROR:',error);
      toast(error.message,'err');
      setLoading(false);
      return;
    }

    const mapped=(data||[]).map(f=>({
      id:f.id,
      q:f.question||'',
      a:f.answer||'',
      cat:f.category||'General',
      keywords:Array.isArray(f.keywords)?f.keywords.join(', '):(f.keywords||''),
      published:f.published!==false,
      created_by:f.created_by||null,
      created_at:f.created_at,
      updated_at:f.updated_at
    }));

    setItems(mapped);
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const save=async()=>{
    if(!m.q.trim())return toast('Question is required','err');
    if(!m.a.trim())return toast('Answer is required','err');

    const keywords=m.keywords
      ? m.keywords.split(',').map(x=>x.trim()).filter(Boolean)
      : [];

    const payload={
      question:m.q.trim(),
      answer:m.a.trim(),
      category:m.cat?.trim()||'General',
      keywords,
      published:m.published!==false
    };

    let data,error;

    if(m.id){
      ({data,error}=await supabase
        .from('faqs')
        .update(payload)
        .eq('id',m.id)
        .select('*')
        .single());
    }else{
      ({data,error}=await supabase
        .from('faqs')
        .insert({
          ...payload,
          created_by:authUser?.id||null
        })
        .select('*')
        .single());
    }

    if(error){
      console.error('FAQ SAVE ERROR:',error);
      toast(error.message,'err');
      return;
    }

    const mapped={
      id:data.id,
      q:data.question||'',
      a:data.answer||'',
      cat:data.category||'General',
      keywords:Array.isArray(data.keywords)?data.keywords.join(', '):(data.keywords||''),
      published:data.published!==false,
      created_by:data.created_by||null,
      created_at:data.created_at,
      updated_at:data.updated_at
    };

    const next=m.id
      ? items.map(x=>x.id===m.id?mapped:x)
      : [mapped,...items];

    setItems(next);
    S.setF(next.filter(x=>x.published));
    setM(null);
    toast(m.id?'FAQ updated successfully':'FAQ created successfully');
  };

  const del=async(id)=>{
    if(!confirm('Delete this FAQ?'))return;

    const {error}=await supabase
      .from('faqs')
      .delete()
      .eq('id',id);

    if(error){
      console.error('FAQ DELETE ERROR:',error);
      toast(error.message,'err');
      return;
    }

    const next=items.filter(x=>x.id!==id);
    setItems(next);
    S.setF(next.filter(x=>x.published));
    toast('FAQ deleted successfully');
  };

  const list=items.filter(x=>
    (x.q+' '+x.a+' '+x.cat+' '+x.keywords).toLowerCase().includes(q.toLowerCase())
  );

  const blank={q:'',a:'',cat:'General',keywords:'',published:true};

  return <div>
    <Head t="FAQ Management" s="Manage the knowledge base used by CampusAI." >
      <Btn onClick={()=>setM(blank)}>+ Create FAQ</Btn>
    </Head>

    <div className="flex flex-wrap gap-2 mb-4">
      <input
        className={inp+' max-w-md'}
        placeholder="Search questions, answers or keywords..."
        value={q}
        onChange={e=>setQ(e.target.value)}
      />
    </div>

    <Card c="overflow-x-auto">
      {loading ? <div className="p-10 text-center text-slate-500">Loading FAQs...</div> :
       list.length ? <table className="w-full text-sm">
        <thead className="bg-slate-50 text-left text-slate-500">
          <tr>
            {['Question','Answer','Category','Keywords','Published'].map(h=><th key={h} className="p-3">{h}</th>)}
            <th className="p-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          {list.map(f=><tr key={f.id} className="border-t border-slate-100 align-top">
            <td className="p-3 min-w-[220px] font-medium">{f.q}</td>
            <td className="p-3 min-w-[280px] text-slate-600">{f.a}</td>
            <td className="p-3">{f.cat}</td>
            <td className="p-3 text-slate-500">{f.keywords||'—'}</td>
            <td className="p-3"><Badge s={f.published?'Active':'Draft'}/></td>
            <td className="p-3 whitespace-nowrap">
              <button className="text-indigo-600 mr-3" onClick={()=>setM({...f})}>Edit</button>
              <button className="text-red-600" onClick={()=>del(f.id)}>Delete</button>
            </td>
          </tr>)}
        </tbody>
      </table> : <Empty t="No FAQs found"/>}
    </Card>

    {m&&<Modal title={(m.id?'Edit ':'Create ')+'FAQ'} onClose={()=>setM(null)}>
      <Field l="Question" value={m.q} onChange={e=>setM({...m,q:e.target.value})}/>
      <Field l="Answer" t="textarea" value={m.a} onChange={e=>setM({...m,a:e.target.value})}/>
      <Field l="Category" value={m.cat} onChange={e=>setM({...m,cat:e.target.value})}/>

  const loadComplaints=async()=>{
    setLoading(true);

    const {data,error}=await supabase
      .from('complaints')
      .select('*')
      .order('created_at',{ascending:false});

    if(error){
      console.error('ADMIN COMPLAINT LOAD ERROR:',error);
      toast(error.message,'err');
      setLoading(false);
      return;
    }

    const mapped=(data||[]).map(c=>({
      id:c.id,
      title:c.title,
      desc:c.description||'',
      cat:c.category||'Other',
      location:c.location||'',
      status:c.status,
      priority:c.priority,
      date:c.created_at,
      student:c.user_id,
      resp:c.admin_response||''
    }));

    setItems(mapped);
    S.setC(mapped);
    setLoading(false);
  };

  useEffect(()=>{
    loadComplaints();

    const loadDashboardData=async()=>{
      const today=new Date().toISOString().slice(0,10);

      const [studentsRes,noticesRes,eventsRes,recentNoticesRes,upcomingEventsRes]=await Promise.all([
        supabase.from('profiles').select('id',{count:'exact',head:true}).eq('role','student'),
        supabase.from('notices').select('id',{count:'exact',head:true}).eq('published',true),
        supabase.from('events').select('id',{count:'exact',head:true}).eq('published',true).gte('event_date',today),
        supabase.from('notices').select('id,title,category,priority,created_at').eq('published',true).order('created_at',{ascending:false}).limit(5),
        supabase.from('events').select('id,title,event_date,start_time,venue,category').eq('published',true).gte('event_date',today).order('event_date',{ascending:true}).order('start_time',{ascending:true}).limit(5)
      ]);

      const errors=[studentsRes,noticesRes,eventsRes,recentNoticesRes,upcomingEventsRes].filter(r=>r.error);
      if(errors.length){
        console.error('ADMIN DASHBOARD DATA ERROR:',errors.map(r=>r.error));
        toast('Some dashboard data could not be loaded','err');

      setDbStats({
        students:studentsRes.count||0,

            )) : <Empty t="No published notices" />}
          </Card>

          <Card>
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-semibold">Upcoming Events</h3>
              <button className="text-xs text-indigo-600 font-medium" onClick={()=>nav('/admin/events')}>View all</button>
            </div>
            {upcomingEvents.length ? upcomingEvents.map(e=>(
              <div key={e.id} className="py-3 border-b last:border-0 border-slate-100">
                <div className="font-medium text-sm">{e.title}</div>
                <div className="text-xs text-slate-500 mt-1">{e.category||'General'} • {e.event_date}{e.start_time ? ' • '+String(e.start_time).slice(0,5) : ''}{e.venue ? ' • '+e.venue : ''}</div>
              </div>
            )) : <Empty t="No upcoming events" />}
          </Card>

        </div>

        <div className="flex items-center justify-between mb-2">
          <h3 className="font-semibold">Recent Complaints</h3>
          <span className="text-xs text-slate-500">Resolution rate: {rate}%</span>
        </div>
        <CT n={5}/>

        {m && rev}

      </div>
    );
  }

  if(a==='complaints'){
    return (
      <div>

        <Head
          t="Complaint Management"
          s="Review and update student complaints."
        />

        <CT n={99}/>

        {m && rev}

      </div>
    );
  }

  if(a==='students'){
    return (
      <Crud
        title="Students"
        noun="Student"
        items={S.students}
        setItems={S.setS}
        cols={[
          ['Student','name'],
          ['Student ID','sid'],
          ['Department','dept'],
          ['Semester','sem'],
          ['Email','email'],
          ['Status','status']
        ]}
        fields={[
          {k:'name',l:'Full Name'},
          {k:'sid',l:'Student ID'},
          {k:'email',l:'Email'},
          {k:'dept',l:'Department'},
          {
            k:'sem',
            l:'Semester',
            t:'select',
            opts:['1','2','3','4','5','6','7','8']
          },
          {
            k:'status',
            l:'Status',
            t:'select',
            opts:['Active','Inactive']
          }
        ]}
        filters={[
          {
            k:'dept',
            l:'departments',
            opts:DEPTS
          },
          {
            k:'sem',
            l:'semesters',
            opts:['1','2','3','4','5','6','7','8']
          }
        ]}
      />
    );
  }

  if(a==='notices'){
    return <AdminNotices/>;
  }

  if(a==='events'){
    return <AdminEvents/>;
  }

  if(a==='faqs'){
    return <AdminFAQs/>;
  }

  if(a==='analytics'){
    const activeComplaints=cnt('Submitted')+cnt('Under Review')+cnt('In Progress');
    const resolved=cnt('Resolved');
    const rejected=cnt('Rejected');

    const priorityData=[
      ['Low',items.filter(c=>c.priority==='Low').length,'bg-slate-400'],
      ['Normal',items.filter(c=>c.priority==='Normal').length,'bg-indigo-500'],
      ['High',items.filter(c=>c.priority==='High').length,'bg-amber-500'],
      ['Urgent',items.filter(c=>c.priority==='Urgent').length,'bg-red-500']
    ];

    const categoryData=byC.length?byC:[['No complaints yet',0,'bg-slate-300']];

    return (
      <div>
        <Head t="Analytics & Reports" s="Live campus analytics generated from Supabase data."/>

          <Stat i="🎓" l="Total Students" v={dbStats.students} c="bg-indigo-50"/>
          <Stat i="📢" l="Published Notices" v={dbStats.notices} c="bg-amber-50"/>
          <Stat i="🎉" l="Upcoming Events" v={dbStats.events} c="bg-pink-50"/>
          <Stat i="📝" l="Total Complaints" v={total} c="bg-violet-50"/>
          <Stat i="⏳" l="Active Complaints" v={activeComplaints} c="bg-blue-50"/>
          <Stat i="🔎" l="Under Review" v={cnt('Under Review')} c="bg-yellow-50"/>
          <Stat i="⚙️" l="In Progress" v={cnt('In Progress')} c="bg-sky-50"/>
          <Stat i="✅" l="Resolved" v={resolved} c="bg-green-50"/>
        </div>

        <div className="grid lg:grid-cols-3 gap-4 mb-5">
          <Card c="p-5 lg:col-span-2">
            <div className="flex items-center justify-between mb-4">
              <div><h3 className="font-semibold">Complaint Resolution</h3><p className="text-xs text-slate-500 mt-1">Resolved complaints compared with all complaints.</p></div>
              <div className="text-3xl font-bold text-indigo-600">{rate}%</div>
            </div>
            <div className="h-4 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-green-500 rounded-full" style={{width:rate+'%'}}></div></div>
            <div className="grid grid-cols-3 gap-3 mt-4 text-sm">
              <div className="bg-slate-50 rounded-xl p-3"><div className="text-xs text-slate-500">Total</div><b>{total}</b></div>
              <div className="bg-green-50 rounded-xl p-3"><div className="text-xs text-slate-500">Resolved</div><b>{resolved}</b></div>
              <div className="bg-red-50 rounded-xl p-3"><div className="text-xs text-slate-500">Rejected</div><b>{rejected}</b></div>
            </div>
          </Card>
          <Card c="p-5">
            <h3 className="font-semibold">Campus Overview</h3>
            <div className="space-y-4 mt-4 text-sm">
              <div className="flex justify-between"><span className="text-slate-500">Students</span><b>{dbStats.students}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Published notices</span><b>{dbStats.notices}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Upcoming events</span><b>{dbStats.events}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Active complaints</span><b>{activeComplaints}</b></div>
              <div className="pt-3 border-t border-slate-100 text-xs text-slate-400">Data is loaded live from Supabase.</div>
            </div>
          </Card>
        </div>

        <div className="grid md:grid-cols-2 gap-4 mb-5">
          <Bars t="Complaint Status Distribution" d={byS}/>
          <Bars t="Complaint Category Distribution" d={categoryData}/>
          <Bars t="Complaint Priority Distribution" d={priorityData}/>
          <Card c="p-5">
            <h3 className="font-semibold mb-4">Key Metrics</h3>
            <div className="space-y-3 text-sm">
              <div className="flex justify-between border-b border-slate-100 pb-3"><span>Resolution rate</span><b>{rate}%</b></div>
              <div className="flex justify-between border-b border-slate-100 pb-3"><span>Active complaint share</span><b>{total?Math.round(activeComplaints/total*100):0}%</b></div>
              <div className="flex justify-between border-b border-slate-100 pb-3"><span>Resolved complaints</span><b>{resolved}</b></div>
              <div className="flex justify-between"><span>Rejected complaints</span><b>{rejected}</b></div>
            </div>
          </Card>
        </div>

        <Card c="p-5">
          <div className="flex items-center justify-between mb-4">
            <div><h3 className="font-semibold">Report Summary</h3><p className="text-sm text-slate-500 mt-1">Current snapshot for the CampusAI administration panel.</p></div>
            <span className="text-xs px-3 py-1 rounded-full bg-green-50 text-green-700">Live Data</span>
          </div>

            <div className="rounded-xl bg-slate-50 p-4"><div className="text-xs text-slate-500">Complaints</div><div className="font-semibold mt-1">{activeComplaints} active · {resolved} resolved</div></div>
            <div className="rounded-xl bg-slate-50 p-4"><div className="text-xs text-slate-500">Students</div><div className="font-semibold mt-1">{dbStats.students} registered student profiles</div></div>
          </div>
        </Card>
      </div>

function App(){
  const [h,setH]=useState(location.hash);
  const [authUser,setAuthUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);

  useEffect(()=>{
    const f=()=>{setH(location.hash);scrollTo(0,0)};
    addEventListener('hashchange',f);

    let mounted=true;

    const loadSession=async()=>{
      const {data:{session}}=await supabase.auth.getSession();
      if(!mounted)return;

      setAuthUser(session?.user||null);

      if(session?.user){
        const {data:p}=await supabase
          .from('profiles')
          .select('*')
          .eq('id',session.user.id)
          .single();
        if(mounted)setProfile(p||null);
      }

      if(mounted)setAuthLoading(false);
    };

    loadSession();

    const {data:{subscription}}=supabase.auth.onAuthStateChange(async(_event,session)=>{
      setAuthUser(session?.user||null);

      if(session?.user){
        const {data:p}=await supabase
          .from('profiles')
          .select('*')
          .eq('id',session.user.id)
          .single();
        if(mounted)setProfile(p||null);
      }else{
        setProfile(null);
      }
    });

    return()=>{
      mounted=false;
      removeEventListener('hashchange',f);
      subscription.unsubscribe();
    };
  },[]);

  const [notices,setN]=useState(D.notices),[events,setE]=useState(D.events),
    [complaints,setC]=useState(D.complaints),[faqs,setF]=useState(D.faqs),
    [students,setS]=useState(D.students);

    useEffect(() => {
  const loadEvents = async () => {
    const { data, error } = await supabase
      .from('events')
      .select('*')
      .eq('published', true)
      .order('event_date', { ascending: true })
      .order('start_time', { ascending: true });

    if (error) {
      console.error('EVENT LOAD ERROR:', error);
      return;
    }

    const mapped = (data || []).map(e => ({
      id: e.id,
      title: e.title,
      desc: e.description || '',
      date: e.event_date,
      time: e.start_time
        ? String(e.start_time).slice(0, 5)
        : '',
      endTime: e.end_time
        ? String(e.end_time).slice(0, 5)
        : '',
      loc: e.venue || '',
      org: e.organizer || '',
      category: e.category || 'General',
      registration_url: e.registration_url || '',
      image_url: e.image_url || '',
      published: e.published
    }));

    setE(mapped);
  };

  if (authUser) {
    loadEvents();
  }
}, [authUser]);

      useEffect(() => {
    const loadNotices = async () => {
      const { data, error } = await supabase
        .from('notices')
        .select('*')
        .eq('published', true)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('NOTICE LOAD ERROR:', error);
        return;
      }

      const mapped = (data || []).map(n => ({
        id: n.id,
        title: n.title,
        desc: n.content || '',
        body: n.content || '',
        cat: n.category || 'General',
        priority: n.priority || 'Normal',
        date: n.created_at,
        status: n.published ? 'Active' : 'Inactive'
      }));

      setN(mapped);
    };

    if (authUser) {
      loadNotices();
    }
  }, [authUser]);

  useEffect(() => {
    const loadFaqs = async () => {
      const { data, error } = await supabase
        .from('faqs')
        .select('id,question,answer,category,keywords,published,created_by,created_at,updated_at')
        .eq('published', true)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('FAQ LOAD ERROR:', error);
        return;
      }

      const mapped = (data || []).map(f => ({
        id: f.id,
        q: f.question || '',
        a: f.answer || '',
        cat: f.category || 'General',
        keywords: Array.isArray(f.keywords) ? f.keywords.join(', ') : (f.keywords || ''),
        published: f.published !== false,
        created_by: f.created_by || null,
        created_at: f.created_at,
        updated_at: f.updated_at
      }));

      setF(mapped);
    };

    if (authUser) {
      loadFaqs();
    }
  }, [authUser]);

  const me=profile?{
    name:profile.full_name||profile.email||'Student',
    id:profile.student_id||'',
    email:profile.email||authUser?.email||'',
    dept:profile.department||DEPTS[0],
    sem:String(profile.semester||1),
    role:profile.role||'student'
  }:{
    name:'Student',id:'',email:authUser?.email||'',dept:DEPTS[0],sem:'1',role:'student'
  };

  const [t,setT]=useState(null);
  const toast=(m,k)=>{setT({m,k});setTimeout(()=>setT(null),2400)};

  const logout=async()=>{
    await supabase.auth.signOut();
    nav('/login');
    toast('Logged out successfully');
  };

  const S={notices,setN,events,setE,complaints,setC,faqs,setF,students,setS,tt:D.tt};

  const p=h.slice(1)||'/';
  const seg=p.split('/').filter(Boolean);

  if(authLoading){
    return <div className="min-h-screen flex items-center justify-center">
      <div className="text-center">
        <div className="text-3xl mb-2">✦</div>
        <div className="font-semibold">Loading CampusAI...</div>
      </div>
    </div>;
  }

  let v;

  if(p==='/')v=<Landing/>;
  else if(p==='/login')v=<Auth/>;
  else if(p==='/signup')v=<Auth signup/>;
  else if(seg[0]==='student'){
    if(!authUser)return <Ctx.Provider value={{S,me,setMe:()=>{},toast}}><Auth/></Ctx.Provider>;
    if(profile?.role==='admin' && !p.startsWith('/student'))return null;
    v=<Shell role="student" path={p}><StudentPage seg={seg}/></Shell>;
  }
  else if(seg[0]==='admin'){
    if(!authUser)return <Ctx.Provider value={{S,me,setMe:()=>{},toast}}><Auth/></Ctx.Provider>;
    if(profile?.role!=='admin'){
      v=<div className="min-h-screen flex flex-col items-center justify-center gap-3">
        <h1 className="text-3xl font-bold">Access Denied</h1>
        <p className="text-slate-500">Admin access is required.</p>
        <Btn onClick={()=>nav('/student/dashboard')}>Go to Student Dashboard</Btn>
      </div>;
    }else{
      v=<Shell role="admin" path={p}><AdminPage seg={seg}/></Shell>;
    }
  }
  else v=<div className="min-h-screen flex flex-col items-center justify-center gap-3"><h1 className="text-3xl font-bold">404 – Page not found</h1><Btn onClick={()=>nav('/')}>Go home</Btn></div>;

  return <Ctx.Provider value={{S,me,setMe:setProfile,toast,authUser,profile,logout}}>{v}{t&&<div className={'fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-xl text-white text-sm shadow-lg '+(t.k==='err'?'bg-red-600':'bg-slate-900')}>{t.m}</div>}</Ctx.Provider>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
